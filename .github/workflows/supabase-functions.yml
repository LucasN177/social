name: Deploy Supabase Edge Functions

# Optional: läuft nur, wenn die Secrets SUPABASE_ACCESS_TOKEN und SUPABASE_PROJECT_REF gesetzt sind.
on:
  push:
    branches: [ "main" ]
    paths: [ "supabase/functions/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
    - name: Check secrets
      id: check
      run: |
        if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
          echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF nicht gesetzt – Edge Functions werden nicht deployt."
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout
      if: steps.check.outputs.skip != 'true'
      uses: actions/checkout@v4

    - name: Setup Supabase CLI
      if: steps.check.outputs.skip != 'true'
      uses: supabase/setup-cli@v1
      with:
        version: latest

    # pg_cron ruft die Funktion ohne User-Token auf (siehe 019_stories_media_replies_cleanup.sql)
    - name: Deploy cleanup-expired-stories
      if: steps.check.outputs.skip != 'true'
      run: supabase functions deploy cleanup-expired-stories --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
