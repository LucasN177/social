name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x

    # Vor dem Publish, damit die Hashes in service-worker-assets.js zur echten Datei passen
    - name: Write Supabase config
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
          echo "::error::Repository-Secrets SUPABASE_URL und SUPABASE_ANON_KEY fehlen (Settings → Secrets and variables → Actions)."
          exit 1
        fi
        jq -n --arg url "$SUPABASE_URL" --arg key "$SUPABASE_ANON_KEY" \
          '{ Supabase: { Url: $url, AnonKey: $key } }' > wwwroot/appsettings.json

    - name: Publish
      run: dotnet publish -c Release -o release

    - name: Update base href
      run: sed -i 's/<base href="\/" \/>/<base href="\/social\/" \/>/' release/wwwroot/index.html

    - name: Copy index.html to 404.html
      run: cp release/wwwroot/index.html release/wwwroot/404.html

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: release/wwwroot

  deploy:
    needs: build-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write      # für Pages-Deploy
      id-token: write   # für OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
