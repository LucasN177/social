name: Tests

# Läuft bei Pull Requests und als Voraussetzung für das Deployment (deploy.yml ruft ihn auf).
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-tests:
    name: Unit-Tests (xUnit, Moq, bUnit)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Test
      run: dotnet test tests/Social.Tests --configuration Release --logger "console;verbosity=normal"

  sql-tests:
    name: SQL-Tests (PGlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: supabase/tests/package-lock.json

    - name: Install
      run: npm ci

    - name: Test
      run: npm test
