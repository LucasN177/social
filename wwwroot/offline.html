<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Social</title>
    <meta name="theme-color" content="#e91e63" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Bewusst ohne externe Dateien: muss auch ohne Netz und ohne übrigen Cache funktionieren -->
    <style>
        :root {
            color-scheme: light dark;
            --bg: #fafafa;
            --text: #1f1f24;
            --muted: #6b6b76;
            --card: #ffffff;
            --line: rgba(0, 0, 0, 0.08);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #121216;
                --text: #f2f2f5;
                --muted: #a0a0ab;
                --card: #1c1c22;
                --line: rgba(255, 255, 255, 0.08);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            background: var(--bg);
        }

        main {
            width: 100%;
            max-width: 420px;
            padding: 32px 24px;
            border: 1px solid var(--line);
            border-radius: 20px;
            text-align: center;
            background: var(--card);
        }

        .logo {
            display: inline-grid;
            place-items: center;
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: linear-gradient(135deg, #e91e63, #ff5722);
        }

        .logo svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: #fff;
            stroke-width: 3;
            stroke-linecap: round;
        }

        .logo circle { fill: #fff; stroke: none; }

        h1 { margin: 20px 0 8px; font-size: 1.4rem; }

        p { margin: 0 0 24px; line-height: 1.5; color: var(--muted); }

        button {
            padding: 10px 22px;
            border: 0;
            border-radius: 999px;
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #e91e63, #ff5722);
            cursor: pointer;
        }

        button:focus-visible { outline: 3px solid #ff8a65; outline-offset: 2px; }

        .status { margin-top: 16px; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
    </style>
</head>
<body>
    <main>
        <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 48 48">
                <circle cx="17" cy="18" r="7" />
                <circle cx="33" cy="18" r="5" opacity="0.75" />
                <path d="M5 38c0-7 5.4-11 12-11s12 4 12 11" />
                <path d="M27 31c1.6-2.4 3.9-3.6 6-3.6 5 0 9 3.4 9 9.6" opacity="0.75" />
            </svg>
        </div>
        <h1>You're offline</h1>
        <p>Social needs an internet connection to load. Check your Wi-Fi or mobile data and try again.</p>
        <button type="button" id="retry">Try again</button>
        <div class="status" id="status" role="status" aria-live="polite"></div>
    </main>

    <script>
        // Sobald die Verbindung zurück ist, automatisch neu laden
        const reload = () => location.reload();
        document.getElementById('retry').addEventListener('click', () => {
            if (navigator.onLine) reload();
            else document.getElementById('status').textContent = 'Still offline…';
        });
        window.addEventListener('online', reload);
    </script>
</body>
</html>
